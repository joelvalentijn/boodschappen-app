name: Nieuwe Lidl-producten ophalen

on:
  schedule:
    # Elke maandag om 06:17 (Nederlandse tijd, zomer)
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-products
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Producten ophalen
        run: node scraper.mjs

      - name: Wijzigingen opslaan
        run: |
          if git diff --quiet -- products.json; then
            echo "Geen nieuwe of verdwenen producten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Productcatalogus bijgewerkt ($(date +%Y-%m-%d))"
          git push
